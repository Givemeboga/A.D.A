name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scan the whole history, not just the last commit
      - name: Install gitleaks 8.21.2
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Scan for secrets
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
